server:
  port: 8083

spring:
  application:
    name: listing-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/listing_db?gssencmode=disable
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:listing_service}
        format_sql: true

  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:listing_service}
    baseline-on-migrate: true
    locations: classpath:db/migration
